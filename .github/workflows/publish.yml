# Publish the package to PyPI when a GitHub release is published.
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # skip-existing (below) would turn a release whose version bump was forgotten into a green
      # no-op, and a manual run from a branch could publish an unreleased version for good, so only
      # a tag that matches geotrax.__version__ may be built and published.
      - name: Check the tag against geotrax.__version__
        run: |
          version=$(sed -n "s/^__version__ = ['\"]\(.*\)['\"].*/\1/p" geotrax/__init__.py)
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::Publish from a release tag, not from '$GITHUB_REF_NAME'."
            exit 1
          fi
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match geotrax.__version__ '$version'; bump the version first."
            exit 1
          fi
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/geo-trax/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Tolerate a re-created release for the same version (e.g. when retrying a
          # failed GitHub->Zenodo archive): skip files already on PyPI instead of erroring.
          skip-existing: true

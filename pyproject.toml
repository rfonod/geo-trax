# Overview:
# This pyproject.toml manages the build, packaging, and distribution of the geo-trax library.
# It defines project metadata, dependencies, and tool settings.
#
# Key Sections:
# - [build-system]: Build requirements and backend (setuptools).
# - [project]: Metadata, required and optional dependencies.
# - [project.optional-dependencies]: Optional packages for development (dev), model export (export), and SAHI sliced inference (sahi).
# - [project.scripts]: The 'geotrax' console command (see geotrax/cli.py for subcommands).
# - [tool.*]: Tool configurations (setuptools, ruff, pytest).
#
# Installation (requires Python >= 3.11):
#   python -m pip install geo-trax           # from PyPI; installs the 'geotrax' CLI and bundled configs
#   python -m pip install 'geo-trax[dev]'    # from PyPI + dev
#   python -m pip install 'geo-trax[export]' # from PyPI + ONNX export
#   python -m pip install 'geo-trax[sahi]'   # from PyPI + SAHI sliced inference
#   python -m pip install -e .               # core; -e (editable) reflects code changes without reinstalling
#   python -m pip install -e '.[dev]'        # core + dev (pip)
#   python -m pip install -e '.[export]'     # core + export (pip)
#   python -m pip install -e '.[sahi]'       # core + SAHI sliced inference (pip)
#   poetry install                           # core (Poetry; auto-manages virtualenv)
#   poetry install --extras dev              # core + dev (Poetry)
#   poetry install --extras export           # core + export (Poetry)
#   poetry install --extras sahi             # core + sahi (Poetry)
#   uv venv --python 3.11 && uv pip install -e .           # core (uv; faster)
#   uv venv --python 3.11 && uv pip install -e '.[dev]'    # core + dev (uv)
#   uv venv --python 3.11 && uv pip install -e '.[export]' # core + export (uv)
#   uv venv --python 3.11 && uv pip install -e '.[sahi]'   # core + sahi (uv)

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-trax"
dynamic = ["version"]
description = "A Comprehensive Framework for Georeferenced Vehicle Trajectory Extraction from Drone Imagery"
# Two entries, not a combined {name, email}: a combined entry folds into 'Author-email: Name <email>'
# and leaves the 'Author' core-metadata field empty (which is what pepy.tech and similar read).
authors = [
    { name = "Robert Fonod" },
    { email = "robert.fonod@ieee.org" },
]
maintainers = [
    { name = "Robert Fonod" },
    { email = "robert.fonod@ieee.org" },
]
readme = "README.md"
# The legacy table form (not the SPDX string) is what emits the 'License' core-metadata field;
# the SPDX string emits 'License-Expression', which several dashboards do not read yet. Do not add
# 'license-files' alongside it -- setuptools then fails with `project.license must be string`.
# LICENSE is auto-detected, so 'License-File' stays populated either way. Deprecated by setuptools
# with a removal date of 2027-Feb-18; revert to `license = "MIT"` then, or once consumers catch up.
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["trajectory-extraction", "trajectory-stabilization", "georeferencing", "object-detection", "object-tracking", "vehicle-tracking", "computer-vision", "deep-learning", "yolo", "drone", "aerial-imagery", "traffic-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",
    "Topic :: Multimedia :: Video",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "ultralytics[extra]>=8.4.80,<9.0",
    "huggingface_hub>=0.30",
    "lapx>=0.5.2",
    "stabilo>=1.4.1",
    "geopandas>=1.0.0",
    "matplotlib>=3.3.0",
    "seaborn>=0.11.0",
    "pysrt>=1.1.2",
    "tifffile",
    "comet_ml",
]

[project.optional-dependencies]
dev = [
    "ultralytics[dev]",
    "pytest>=6.0",
    "ruff",
]
export = [
    "ultralytics[export-base]",  # ONNX export/optimization/runtime via the Ultralytics export backend (onnx, onnxslim, onnxruntime, ...)
]
sahi = [
    "sahi>=0.11.21",  # SAHI sliced inference; 0.11.20 added the 'ultralytics' model type, 0.11.21 dropped the numpy<2 pin
]

[project.urls]
Homepage = "https://github.com/rfonod/geo-trax/"
Source = "https://github.com/rfonod/geo-trax/"
Repository = "https://github.com/rfonod/geo-trax/"
Changelog = "https://github.com/rfonod/geo-trax/releases"
Issues = "https://github.com/rfonod/geo-trax/issues/"

[project.scripts]
geotrax = "geotrax.cli:main"

[tool.setuptools]
packages = { find = { where = ["."], include = ["geotrax", "geotrax.*"] } }

[tool.setuptools.dynamic]
version = { attr = "geotrax.__version__" }

[tool.setuptools.package-data]
geotrax = ["cfg/*.yaml", "cfg/**/*.yaml"]  # bundle the default configuration tree in wheels

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ['E', 'F', 'W', 'A', "B", 'PLC', 'PLE', 'PLW', 'I']

[tool.ruff.format]
docstring-code-format = true
quote-style = "preserve"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra"
testpaths = [
    "tests",
]